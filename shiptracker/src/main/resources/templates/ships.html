<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcos — ShipTracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-main">
    <div class="container">
        <div class="page-header">
            <h1>Listado de Barcos</h1>
            <p th:text="${totalCount} + ' barcos encontrados'">0 barcos encontrados</p>
        </div>

        <!-- Filtros -->
        <form th:action="@{/ships}" method="get" class="filter-bar">
            <input type="text" name="search" placeholder="Buscar por nombre..."
                   th:value="${search}" class="search-input">
            <select name="type" class="select-input">
                <option value="" th:selected="${selectedType == null}">Todos los tipos</option>
                <option value="Cargo"    th:selected="${selectedType == 'Cargo'}">Carguero</option>
                <option value="Tanque"   th:selected="${selectedType == 'Tanque'}">Tanquero</option>
                <option value="Pasajeros" th:selected="${selectedType == 'Pasajeros'}">Pasajeros</option>
                <option value="RoRo"     th:selected="${selectedType == 'RoRo'}">RoRo</option>
            </select>
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/ships}" class="btn btn-outline">Limpiar</a>
        </form>

        <!-- Tabla -->
        <div class="table-wrapper">
            <table class="ships-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>MMSI</th>
                        <th>Tipo</th>
                        <th>Bandera</th>
                        <th>Estado</th>
                        <th>Destino</th>
                        <th>Velocidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ship : ${ships}" th:if="${ships != null and !ships.isEmpty()}">
                        <td class="ship-name-cell">
                            <a th:href="@{/ships/{mmsi}(mmsi=${ship.mmsi})}" th:text="${ship.name}">NOMBRE</a>
                        </td>
                        <td class="mmsi-cell" th:text="${ship.mmsi}">000</td>
                        <td><span class="type-badge" th:text="${ship.type}">Tipo</span></td>
                        <td th:text="${ship.flag}">ES</td>
                        <td>
                            <span class="status-badge"
                                  th:text="${ship.status}"
                                  th:classappend="${ship.status == 'En navegación' ? ' status-green' :
                                                   ship.status == 'Fondeado' ? ' status-yellow' : ' status-blue'}">
                            </span>
                        </td>
                        <td th:text="${ship.destination ?: 'N/D'}">-</td>
                        <td th:text="${ship.speed} + ' kn'">0 kn</td>
                        <td>
                            <a th:href="@{/ships/{mmsi}(mmsi=${ship.mmsi})}" class="btn btn-xs btn-outline">Ver</a>
                        </td>
                    </tr>
                    <tr th:if="${ships == null or ships.isEmpty()}">
                        <td colspan="8" class="no-results">No se encontraron barcos</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
