<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — ShipTracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="auth-main">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">&#9875;</span>
            <h1>Crear cuenta</h1>
            <p>Únete a ShipTracker y guarda tus barcos favoritos</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/register}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username"
                       placeholder="Elige un nombre de usuario" required
                       minlength="3" maxlength="30" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="tu@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="Mínimo 6 caracteres" required
                       minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Repite la contraseña" required
                       minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
        </form>

        <p class="auth-switch">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </p>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
